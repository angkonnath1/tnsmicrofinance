{% load static %}
<!-- Agentation Visual AI Feedback Toolbar -->
<div id="agentation-root"></div>
<script>
  (function () {
    // Only load during local development to avoid exposing dev tooling in production
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '0.0.0.0' || location.hostname.endsWith('.local')) {
      if (!window.__agentationScriptLoaded) {
        window.__agentationScriptLoaded = true;
        var s = document.createElement('script');
        s.src = "{% static 'js/agentation.bundle.js' %}";
        s.defer = true;
        document.body.appendChild(s);
      }
    }
  })();
</script>
